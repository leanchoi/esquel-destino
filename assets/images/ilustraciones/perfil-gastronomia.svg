  <path d="M416,250 L504,130 L568,210 L640,100 L736,250 Z" fill="#A49A90"/>
  <path d="M600,155 L640,100 L680,155 L648,145 L624,165 Z" fill="#F7F3EC"/>
  <rect x="416" y="50" width="320" height="230" rx="6" fill="none" stroke="#8A6242" stroke-width="7"/>
  <line x1="576" y1="50" x2="576" y2="280" stroke="#8A6242" stroke-width="5"/>
  <!-- mesa -->
  <rect x="0" y="340" width="800" height="160" fill="#8A6242"/>
  <rect x="0" y="340" width="800" height="10" fill="#A97C53"/>
  <!-- tetera -->
  <ellipse cx="192" cy="300" rx="52" ry="42" fill="#AB2759"/>
  <path d="M142,290 q-34,-6 -30,18 q2,16 22,10" fill="none" stroke="#AB2759" stroke-width="9" stroke-linecap="round"/>
  <path d="M236,275 q26,-16 30,4" fill="none" stroke="#AB2759" stroke-width="9" stroke-linecap="round"/>
  <rect x="178" y="250" width="28" height="12" rx="5" fill="#C95480"/>
