  <path d="M352,315 h34 a4,4 0 0 1 4,4 v10 a18,18 0 0 1 -18,18 h-6 a18,18 0 0 1 -18,-18 v-10 a4,4 0 0 1 4,-4 Z" fill="#F7F3EC" stroke="#71675D" stroke-width="3"/>
  <!-- torta -->
  <path d="M64,330 l70,0 l-10,-34 l-50,0 Z" fill="#A97C53"/>
  <path d="M74,296 l50,0 l-4,-12 l-42,0 Z" fill="#C95480"/>
